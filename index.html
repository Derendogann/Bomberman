<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Bomberman</title>
  <style>
    body { margin:0; background:#0f1220; color:#eaeaea; font-family: system-ui, -apple-system, Segoe UI, Roboto; }
    .wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; }
    canvas { background:#12162a; border:1px solid #2b335a; border-radius:12px; }
    .panel { max-width:340px; line-height:1.5; }
    .kbd { padding:2px 6px; border:1px solid #444; border-bottom-width:2px; border-radius:6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="c" width="640" height="640"></canvas>
    <div class="panel">
      <h2>Mini Bomberman</h2>
      <p>
        Hareket: <span class="kbd">WASD</span> / <span class="kbd">←↑↓→</span><br/>
        Bomba: <span class="kbd">Space</span><br/>
        Reset: <span class="kbd">R</span>
      </p>
      <p>Duvarlar kırılmaz, kutular kırılır. Düşmanlar bitince sonraki levele geçersin.</p>
      <p id="status"></p>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");

  const VERSION = "v2.1";
  let screenShake = 0;  // ms
  let shakeAmp = 0;     // px

  // ---- Grid / tiles ----
  const TILE = 40;                 // 16x16 => 640px
  const W = 16, H = 16;

  const T = { EMPTY:0, WALL:1, BOX:2 };

  // ---- Time ----
  const now = () => performance.now();

  // ---- Level definitions ----
  // Legend:
  // # = WALL, b = BOX, . = EMPTY
  const LEVELS = [
    {
      map: [
        "################",
        "#..bbbb..b.....#",
        "#.#.#.#.#.#.#..#",
        "#..b....b...b..#",
        "#.#.#.#.#.#.#..#",
        "#..b....b...b..#",
        "#.#.#.#.#.#.#..#",
        "#..b....b...b..#",
        "#.#.#.#.#.#.#..#",
        "#..b....b...b..#",
        "#.#.#.#.#.#.#..#",
        "#..b....b...b..#",
        "#.#.#.#.#.#.#..#",
        "#.....b....b...#",
        "#..............#",
        "################",
      ],
      playerSpawn: { x: 1, y: 1 },
      enemies: [{ x: 14, y: 14 }, { x: 14, y: 1 }],
    },
    {
      map: [
        "################",
        "#..bbbb..bbbb..#",
        "#.#.#.#.#.#.#..#",
        "#..b..b.....b..#",
        "#.#.#.#.#.#.#..#",
        "#..b....bbb.b..#",
        "#.#.#.#.#.#.#..#",
        "#..b..b.....b..#",
        "#.#.#.#.#.#.#..#",
        "#..b....bbb.b..#",
        "#.#.#.#.#.#.#..#",
        "#..b..b.....b..#",
        "#.#.#.#.#.#.#..#",
        "#..bbbb..bbbb..#",
        "#..............#",
        "################",
      ],
      playerSpawn: { x: 1, y: 1 },
      enemies: [{ x: 14, y: 14 }, { x: 14, y: 1 }, { x: 1, y: 14 }],
    }
  ];

  let currentLevel = 0;

  // ---- World state (changes per level) ----
  let map = [];
  let enemies = [];

  // ---- Player ----
  const player = {
    x: 1, y: 1,
    alive: true,
    lives: 3,
    invUntil: 0,
    spawn: { x: 1, y: 1 },

    bombsMax: 1,
    bombRange: 2,
  };

  // ---- Bombs / flames ----
  const bombs = [];   // {x,y, placedAt, fuseMs, range, owner}
  const flames = [];  // {x,y, until}

  function parseLevelMap(lines){
    const m = Array.from({length:H}, () => Array.from({length:W}, () => T.EMPTY));
    for (let y=0; y<H; y++){
      const row = lines[y] || "";
      for (let x=0; x<W; x++){
        const ch = row[x] || ".";
        if (ch === "#") m[y][x] = T.WALL;
        else if (ch === "b") m[y][x] = T.BOX;
        else m[y][x] = T.EMPTY;
      }
    }
    return m;
  }

  function loadLevel(idx){
    const L = LEVELS[idx];
    if (!L){
      statusEl.textContent = "Tebrikler! Tüm levellar bitti. R ile tekrar başlat.";
      return;
    }

    bombs.length = 0;
    flames.length = 0;

    map = parseLevelMap(L.map);

    player.spawn = { ...L.playerSpawn };
    player.x = player.spawn.x;
    player.y = player.spawn.y;
    player.alive = true;
    player.invUntil = now() + 800;

    enemies = L.enemies.map(e => ({
      x: e.x, y: e.y,
      alive: true,
      moveCd: 0
    }));
  }

  // ---- Collision ----
  function isBlocked(x,y){
    if (x<0||y<0||x>=W||y>=H) return true;
    if (map[y][x] === T.WALL) return true;
    if (map[y][x] === T.BOX) return true;
    if (bombs.some(b => b.x===x && b.y===y)) return true;
    return false;
  }

  // ---- Damage / Lives ----
  function damagePlayer(){
    const t = now();
    if (!player.alive) return;
    if (t < player.invUntil) return;

    player.lives -= 1;

    // küçük hit feedback
    screenShake = 120;
    shakeAmp = 4;

    if (player.lives <= 0){
      player.alive = false;
      return;
    }

    player.x = player.spawn.x;
    player.y = player.spawn.y;
    player.invUntil = t + 1500;
  }

  // ---- Bomb placement ----
  function placeBomb(){
    if (!player.alive) return;
    const active = bombs.filter(b => b.owner === "p").length;
    if (active >= player.bombsMax) return;
    if (bombs.some(b => b.x===player.x && b.y===player.y)) return;

    bombs.push({
      x: player.x, y: player.y,
      owner: "p",
      placedAt: now(),
      fuseMs: 900,
      range: player.bombRange,
    });
  }

  function addFlame(x,y, duration=250){
    flames.push({x,y, until: now() + duration});

    if (player.x===x && player.y===y) damagePlayer();

    for (const e of enemies){
      if (e.alive && e.x===x && e.y===y) e.alive = false;
    }
  }

  function explodeBomb(b){
    // explosion feedback
    screenShake = 160;
    shakeAmp = 6;

    addFlame(b.x, b.y);

    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx,dy] of dirs){
      for (let i=1; i<=b.range; i++){
        const nx = b.x + dx*i, ny = b.y + dy*i;
        if (nx<0||ny<0||nx>=W||ny>=H) break;

        if (map[ny][nx] === T.WALL) break;

        addFlame(nx,ny);

        if (map[ny][nx] === T.BOX){
          map[ny][nx] = T.EMPTY;
          break;
        }

        const other = bombs.find(ob => ob.x===nx && ob.y===ny);
        if (other){
          other.placedAt = -999999;
        }
      }
    }
  }

  // ---- Enemies ----
  function updateEnemies(dt){
    for (const e of enemies){
      if (!e.alive) continue;
      e.moveCd -= dt;
      if (e.moveCd > 0) continue;

      const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
      dirs.sort(() => Math.random() - 0.5);

      for (const [dx,dy] of dirs){
        const nx = e.x + dx, ny = e.y + dy;
        if (!isBlocked(nx, ny)){
          e.x = nx; e.y = ny;
          break;
        }
      }

      e.moveCd = 170;
    }
  }

  // ---- Input ----
  const keys = new Set();
  window.addEventListener("keydown", (e) => {
    keys.add(e.code);
    if (e.code === "Space") e.preventDefault();
    if (e.code === "KeyR") reset();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.code));

  let moveCooldown = 0;
  function handleMovement(dt){
    if (!player.alive) return;
    moveCooldown -= dt;
    if (moveCooldown > 0) return;

    const up    = keys.has("ArrowUp") || keys.has("KeyW");
    const down  = keys.has("ArrowDown") || keys.has("KeyS");
    const left  = keys.has("ArrowLeft") || keys.has("KeyA");
    const right = keys.has("ArrowRight") || keys.has("KeyD");

    let dx=0, dy=0;
    if (up) dy = -1;
    else if (down) dy = 1;
    else if (left) dx = -1;
    else if (right) dx = 1;

    if (dx!==0 || dy!==0){
      const nx = player.x + dx, ny = player.y + dy;
      const enteringBomb = bombs.some(b => b.x===nx && b.y===ny);
      const blocked = (nx<0||ny<0||nx>=W||ny>=H) ||
                      map[ny][nx] === T.WALL ||
                      map[ny][nx] === T.BOX ||
                      enteringBomb;

      if (!blocked){
        player.x = nx; player.y = ny;
        moveCooldown = 90;
      }
    }
  }

  function handleActions(){
    if (keys.has("Space")){
      placeBomb();
      keys.delete("Space");
    }
  }

  // ---- Render ----
  function drawTile(x,y,type){
    const px = x*TILE, py = y*TILE;

    // ground
    ctx.fillStyle = "#141a31";
    ctx.fillRect(px, py, TILE, TILE);

    // MUCH softer grid (optional)
    ctx.strokeStyle = "rgba(255,255,255,0.015)";
    ctx.strokeRect(px+0.5, py+0.5, TILE-1, TILE-1);

    if (type === T.WALL){
      ctx.fillStyle = "#2d3568";
      ctx.fillRect(px+2, py+2, TILE-4, TILE-4);

      // shadow strip
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(px+2, py+TILE-6, TILE-4, 4);
    } else if (type === T.BOX){
      ctx.fillStyle = "#7a4c2e";
      ctx.fillRect(px+4, py+4, TILE-8, TILE-8);
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(px+8, py+8, TILE-16, TILE-16);

      // shadow strip
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(px+4, py+TILE-8, TILE-8, 4);
    }
  }

  function drawHUD(){
    const aliveEnemies = enemies.filter(e => e.alive).length;

    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(10, 10, 320, 74);

    ctx.globalAlpha = 1;
    ctx.fillStyle = "#eaeaea";
    ctx.font = "16px system-ui";
    ctx.fillText(`Mini Bomberman ${VERSION}`, 20, 34);
    ctx.fillText(`Level: ${currentLevel + 1}   Can: ${player.lives}   Düşman: ${aliveEnemies}`, 20, 58);
    ctx.restore();
  }

  function drawOverlay(title, subtitle){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.60)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#fff";
    ctx.font = "30px system-ui";
    ctx.fillText(title, 210, 310);
    ctx.font = "16px system-ui";
    ctx.fillText(subtitle, 230, 342);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // screen shake
    ctx.save();
    if (screenShake > 0){
      const ax = (Math.random()*2 - 1) * shakeAmp;
      const ay = (Math.random()*2 - 1) * shakeAmp;
      ctx.translate(ax, ay);
    }

    for (let y=0; y<H; y++){
      for (let x=0; x<W; x++){
        drawTile(x,y,map[y][x]);
      }
    }

    // bombs (pulsing)
    const t = now();
    for (const b of bombs){
      const cx = b.x*TILE + TILE/2, cy = b.y*TILE + TILE/2;

      const pulse = 1 + 0.16 * Math.sin((t - b.placedAt) / 70);
      const r = TILE * 0.28 * pulse;

      ctx.fillStyle = "#111";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ffdd55";
      ctx.beginPath(); ctx.arc(cx+6, cy-6, TILE*0.08, 0, Math.PI*2); ctx.fill();
    }

    // flames (flicker)
    for (const f of flames){
      if (f.until < t) continue;
      const px = f.x*TILE, py = f.y*TILE;

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(px+1, py+1, TILE-2, TILE-2);

      const flick = 0.45 + 0.15 * Math.sin((t + (f.x*13 + f.y*7)) / 35);
      ctx.fillStyle = `rgba(255,170,40,${flick})`;
      ctx.fillRect(px+3, py+3, TILE-6, TILE-6);
    }

    // enemies
    for (const e of enemies){
      if (!e.alive) continue;
      const ex = e.x*TILE, ey = e.y*TILE;
      ctx.fillStyle = "#a6ff6a";
      ctx.beginPath();
      ctx.arc(ex+TILE/2, ey+TILE/2, TILE*0.26, 0, Math.PI*2);
      ctx.fill();

      // tiny shadow
      ctx.fillStyle = "rgba(0,0,0,0.20)";
      ctx.beginPath();
      ctx.ellipse(ex+TILE/2, ey+TILE/2 + 10, TILE*0.22, TILE*0.10, 0, 0, Math.PI*2);
      ctx.fill();
    }

    // player (blink while invincible)
    const blinking = t < player.invUntil && Math.floor(t/120) % 2 === 0;

    if (!blinking){
      const px = player.x*TILE, py = player.y*TILE;

      // shadow
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.beginPath();
      ctx.ellipse(px+TILE/2, py+TILE/2 + 10, TILE*0.22, TILE*0.10, 0, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = player.alive ? "#65d6ff" : "#ff5577";
      ctx.beginPath();
      ctx.arc(px+TILE/2, py+TILE/2, TILE*0.28, 0, Math.PI*2);
      ctx.fill();
    }

    // end shake scope
    ctx.restore();

    // HUD on top (not shaking)
    drawHUD();

    // Overlays
    if (!player.alive){
      drawOverlay("GAME OVER", "R ile reset");
    } else if (!LEVELS[currentLevel]){
      drawOverlay("BİTTİ!", "R ile tekrar başlat");
    }
  }

  // ---- Update loop ----
  let last = now();
  let levelClearedAt = 0;

  function tick(){
    const t = now();
    const dt = t - last; last = t;

    // decay shake
    if (screenShake > 0) screenShake -= dt;
    if (screenShake < 0) screenShake = 0;

    if (!LEVELS[currentLevel]){
      draw();
      requestAnimationFrame(tick);
      return;
    }

    handleMovement(dt);
    handleActions();

    if (player.alive) updateEnemies(dt);

    // bomb fuses
    for (let i=bombs.length-1; i>=0; i--){
      const b = bombs[i];
      if (t - b.placedAt >= b.fuseMs){
        bombs.splice(i,1);
        explodeBomb(b);
      }
    }

    // flames expire
    for (let i=flames.length-1; i>=0; i--){
      if (flames[i].until < t) flames.splice(i,1);
    }

    // Late checks: standing on flame => damage
    if (player.alive && flames.some(f => f.x===player.x && f.y===player.y && f.until>t)){
      damagePlayer();
    }

    // Enemy touches player => damage
    if (player.alive){
      for (const e of enemies){
        if (e.alive && e.x===player.x && e.y===player.y){
          damagePlayer();
          break;
        }
      }
    }

    const aliveEnemies = enemies.filter(e => e.alive).length;

    // Level clear
    if (player.alive && aliveEnemies === 0 && levelClearedAt === 0){
      levelClearedAt = t;
      player.invUntil = t + 1200;
    }
    if (levelClearedAt && t - levelClearedAt > 900){
      currentLevel += 1;
      levelClearedAt = 0;
      loadLevel(currentLevel);
    }

    // UI text (panel)
    if (!player.alive){
      statusEl.textContent =
        `GAME OVER — Can bitti. (R ile reset)\n` +
        `Level: ${currentLevel+1}`;
    } else if (levelClearedAt){
      statusEl.textContent =
        `Level ${currentLevel+1} tamamlandı! Sonraki levele geçiliyor...\n` +
        `Can: ${player.lives} | Kalan düşman: ${aliveEnemies}`;
    } else {
      statusEl.textContent =
        `Level: ${currentLevel+1} | Can: ${player.lives} | Kalan düşman: ${aliveEnemies}`;
    }

    draw();
    requestAnimationFrame(tick);
  }

  function reset(){
    location.reload();
  }

  // start
  loadLevel(currentLevel);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
